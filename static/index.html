<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sentinel Status</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 40px; max-width: 700px; margin: 0 auto; }
    .card { background: #1c1c1c; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .up { border-left: 5px solid #2ecc71; }
    .down { border-left: 5px solid #e74c3c; }
    .badge { padding: 4px 10px; border-radius: 4px; font-weight: bold; }
    .badge.up { background: #2ecc71; color: #000; }
    .badge.down { background: #e74c3c; color: #fff; }

    .panel { background: #1c1c1c; border-radius: 8px; padding: 20px; margin-top: 40px; }
    .panel h2 { margin-top: 0; }
    input { background: #111; border: 1px solid #333; color: #eee; padding: 8px; border-radius: 4px; margin-right: 8px; }
    button { background: #2ecc71; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button.danger { background: #e74c3c; color: #fff; }
    .error-msg { color: #e74c3c; margin-top: 8px; }
    .target-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333; }
  </style>
</head>
<body>
  <h1>Sentinel Status</h1>
  <div id="services"></div>

  <div class="panel" id="auth-panel">
    <h2>Giriş yap</h2>
    <input id="login-username" placeholder="kullanıcı adı">
    <input id="login-password" type="password" placeholder="şifre">
    <button onclick="login()">Giriş yap</button>
    <p><a href="#" onclick="toggleRegister()" style="color:#888">Hesabın yok mu? Kayıt ol</a></p>
    <div id="auth-error" class="error-msg"></div>

    <div id="register-form" style="display:none; margin-top: 16px;">
      <h3>Kayıt ol</h3>
      <input id="reg-username" placeholder="kullanıcı adı"><br><br>
      <input id="reg-email" placeholder="email"><br><br>
      <input id="reg-password" type="password" placeholder="şifre"><br><br>
      <button onclick="register()">Kayıt ol</button>
    </div>
  </div>

  <div class="panel" id="targets-panel" style="display:none;">
    <h2>URL'lerim</h2>
    <input id="new-url" placeholder="https://...">
    <button onclick="addTarget()">Ekle</button>
    <div id="my-targets"></div>
    <button onclick="logout()" style="margin-top:16px; background:#555; color:#eee;">Çıkış yap</button>
  </div>

  <script>
    async function loadStatus() {
      const res = await fetch("/status");
      const data = await res.json();
      const container = document.getElementById("services");
      container.innerHTML = "";
      data.forEach(item => {
        const div = document.createElement("div");
        div.className = `card ${item.status}`;
        div.innerHTML = `
          <div>
            <strong>${item.url}</strong><br>
            <small>${item.response_time_ms ? item.response_time_ms + "ms" : "—"} · ${new Date(item.checked_at).toLocaleTimeString()}</small>
          </div>
          <span class="badge ${item.status}">${item.status.toUpperCase()}</span>
        `;
        container.appendChild(div);
      });
    }

    function toggleRegister() {
      const form = document.getElementById("register-form");
      form.style.display = form.style.display === "none" ? "block" : "none";
    }

    async function register() {
      const username = document.getElementById("reg-username").value;
      const email = document.getElementById("reg-email").value;
      const password = document.getElementById("reg-password").value;

      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password })
      });

      if (res.ok) {
        alert("Kayıt başarılı, şimdi giriş yapabilirsin.");
        toggleRegister();
      } else {
        const err = await res.json();
        document.getElementById("auth-error").textContent = err.detail || "Kayıt başarısız";
      }
    }

    async function login() {
      const username = document.getElementById("login-username").value;
      const password = document.getElementById("login-password").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
      });

      if (res.ok) {
        const data = await res.json();
        localStorage.setItem("sentinel_token", data.access_token);
        showTargetsPanel();
      } else {
        document.getElementById("auth-error").textContent = "Kullanıcı adı veya şifre hatalı";
      }
    }

    function logout() {
      localStorage.removeItem("sentinel_token");
      document.getElementById("auth-panel").style.display = "block";
      document.getElementById("targets-panel").style.display = "none";
    }

    async function showTargetsPanel() {
      document.getElementById("auth-panel").style.display = "none";
      document.getElementById("targets-panel").style.display = "block";
      loadMyTargets();
    }

    async function loadMyTargets() {
      const token = localStorage.getItem("sentinel_token");
      const res = await fetch("/targets", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const targets = await res.json();
      const container = document.getElementById("my-targets");
      container.innerHTML = "";
      targets.forEach(t => {
        const div = document.createElement("div");
        div.className = "target-row";
        div.innerHTML = `<span>${t.url}</span>`;
        const btn = document.createElement("button");
        btn.textContent = "Sil";
        btn.className = "danger";
        btn.onclick = () => deleteTarget(t.id);
        div.appendChild(btn);
        container.appendChild(div);
      });
    }

    async function addTarget() {
      const token = localStorage.getItem("sentinel_token");
      const url = document.getElementById("new-url").value;
      await fetch("/targets", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ url })
      });
      document.getElementById("new-url").value = "";
      loadMyTargets();
    }

    async function deleteTarget(id) {
      const token = localStorage.getItem("sentinel_token");
      await fetch(`/targets/${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      loadMyTargets();
    }

    // Sayfa açılışında, token varsa direkt targets paneline geç
    if (localStorage.getItem("sentinel_token")) {
      showTargetsPanel();
    }

    loadStatus();
    setInterval(loadStatus, 10000);
  </script>
</body>
</html>
